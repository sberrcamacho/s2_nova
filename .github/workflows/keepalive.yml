name: Keep backend awake

# Pings the Render free-tier health endpoint every 10 minutes (Render's
# free plan sleeps after 15 minutes of inactivity, with a ~30-60s cold
# start on the next request afterward) — keeps it from ever going idle
# long enough to sleep. See ARCHITECTURE.md §16 / backend/AGENTS.md
# "Production deployment".
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://s2-nova.onrender.com/api/v1/health
