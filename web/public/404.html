<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>S2 Nova</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: redirects a deep-link 404 back to
      // index.html, encoding the real path in the query string so index.html
      // can restore it via history.replaceState.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
