services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: s2nova
      POSTGRES_PASSWORD: s2nova
      POSTGRES_DB: s2nova
    ports:
      - "5432:5432"
    volumes:
      - s2nova_postgres_data:/var/lib/postgresql/data

volumes:
  s2nova_postgres_data:
